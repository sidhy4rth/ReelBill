name: Security rules

# Runs the Firestore security-rules suite from the private source on the emulator.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    steps:
      - name: Check out the private source
        uses: actions/checkout@v4
        with:
          repository: sidhy4rth/ReelBill-source
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the rules suite
        working-directory: rules-tests
        run: npm ci && npm test
